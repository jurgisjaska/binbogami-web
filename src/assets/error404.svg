<svg class="img" xmlns="http://www.w3.org/2000/svg" height="256" fill="none" viewBox="0 0 800 600">
    <style>
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-404-bg {
            fill: #1a2030;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-404-bubble {
            fill: #232b41;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-404-dark {
            fill: #454c5e;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-404-card {
            fill: #232b41;
        }
        @media (prefers-color-scheme: dark) {
            .tblr-illustrations-404-bg {
                fill: #1a2030;
            }
            .tblr-illustrations-404-bubble {
                fill: #232b41;
            }
            .tblr-illustrations-404-dark {
                fill: #454c5e;
            }
            .tblr-illustrations-404-card {
                fill: #232b41;
            }
        }
    </style>
    <!-- Ground Shadow -->
    <ellipse cx="400" cy="540" rx="260" ry="12" fill="#A6A9B3" opacity="0.4" class="tblr-illustrations-404-bg" />
    
    <!-- Background Cloud/Bubble -->
    <path d="M220 280C220 180 300 120 400 120C500 120 580 180 580 280C620 310 640 370 610 430C580 490 510 510 400 510C290 510 220 490 190 430C160 370 180 310 220 280Z" fill="#F7F8FC" class="tblr-illustrations-404-bubble" />

    <!-- Left 4 Digit -->
    <g transform="translate(200, 220)">
        <path d="M70 0 L10 130 H80 V170 H120 V130 H140 V90 H120 V0 H70 Z M70 45 V90 H35 L70 45 Z" fill="#232B41" class="tblr-illustrations-404-card" />
    </g>

    <!-- Center Floating Portal Window / Searching Screen -->
    <g transform="translate(325, 170)">
        <!-- Window Card -->
        <rect x="0" y="0" width="150" height="210" rx="14" fill="#232B41" class="tblr-illustrations-404-card" />
        <rect x="10" y="10" width="130" height="26" rx="6" fill="#1A2030" />
        <circle cx="26" cy="23" r="4" fill="#D63939" />
        <circle cx="40" cy="23" r="4" fill="#F59F00" />
        <circle cx="54" cy="23" r="4" fill="#2FB344" />
        
        <!-- Screen Content Area -->
        <rect x="10" y="44" width="130" height="156" rx="6" fill="#1A2030" />
        
        <!-- Dashed Missing File Box -->
        <rect x="25" y="60" width="100" height="110" rx="8" fill="none" stroke="#454C5E" stroke-width="3" stroke-dasharray="6 6" />
        
        <!-- Question Mark / Search Icon in Screen -->
        <circle cx="75" cy="105" r="24" fill="#206BC4" opacity="0.2" style="fill: var(--tblr-primary, #206bc4)" />
        <text x="75" y="114" text-anchor="middle" fill="#206BC4" font-family="sans-serif" font-weight="bold" font-size="28" style="fill: var(--tblr-primary, #206bc4)">?</text>
        
        <!-- Floating Document Fold Corner -->
        <path d="M105 60 L125 80 H105 V60 Z" fill="#454C5E" />
    </g>

    <!-- Right 4 Digit -->
    <g transform="translate(460, 220)">
        <path d="M70 0 L10 130 H80 V170 H120 V130 H140 V90 H120 V0 H70 Z M70 45 V90 H35 L70 45 Z" fill="#232B41" class="tblr-illustrations-404-card" />
    </g>

    <!-- Large Magnifying Glass Overlay examining center -->
    <g transform="translate(370, 310)">
        <!-- Handle -->
        <path d="M45 45 L95 95" stroke="#232B41" stroke-width="18" stroke-linecap="round" class="tblr-illustrations-404-card" />
        <path d="M45 45 L95 95" stroke="#454C5E" stroke-width="10" stroke-linecap="round" />
        
        <!-- Glass Rim -->
        <circle cx="20" cy="20" r="45" fill="none" stroke="#206BC4" stroke-width="10" style="stroke: var(--tblr-primary, #206bc4)" />
        <!-- Lens Reflection -->
        <path d="M-10 0 C-10 -20 10 -35 30 -30" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.6" />
    </g>

    <!-- Floating Little Planets / Sparkles -->
    <circle cx="160" cy="180" r="6" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="640" cy="190" r="8" fill="#F59F00" />
    <circle cx="180" cy="460" r="5" fill="#454C5E" />
    <circle cx="620" cy="440" r="6" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />

    <path d="M670 280 L685 280 M677.5 272.5 L677.5 287.5" stroke="#D63939" stroke-width="3" stroke-linecap="round" />
    <path d="M130 330 L142 330 M136 324 L136 336" stroke="#2FB344" stroke-width="3" stroke-linecap="round" />
</svg>
