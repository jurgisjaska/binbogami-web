<svg class="img" xmlns="http://www.w3.org/2000/svg" height="256" fill="none" viewBox="0 0 800 600">
    <style>
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-500-bg {
            fill: #1a2030;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-500-bubble {
            fill: #232b41;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-500-dark {
            fill: #454c5e;
        }
        :where(.theme-dark, [data-bs-theme="dark"]) .tblr-illustrations-500-card {
            fill: #232b41;
        }
        @media (prefers-color-scheme: dark) {
            .tblr-illustrations-500-bg {
                fill: #1a2030;
            }
            .tblr-illustrations-500-bubble {
                fill: #232b41;
            }
            .tblr-illustrations-500-dark {
                fill: #454c5e;
            }
            .tblr-illustrations-500-card {
                fill: #232b41;
            }
        }
    </style>
    <!-- Ground Shadow -->
    <ellipse cx="400" cy="540" rx="260" ry="12" fill="#A6A9B3" opacity="0.4" class="tblr-illustrations-500-bg" />
    
    <!-- Background Cloud/Bubble -->
    <path d="M220 280C220 180 300 120 400 120C500 120 580 180 580 280C620 310 640 370 610 430C580 490 510 510 400 510C290 510 220 490 190 430C160 370 180 310 220 280Z" fill="#F7F8FC" class="tblr-illustrations-500-bubble" />

    <!-- Left Server Tower -->
    <rect x="230" y="190" width="130" height="300" rx="12" fill="#232B41" class="tblr-illustrations-500-card" />
    <rect x="242" y="210" width="106" height="36" rx="6" fill="#1A2030" />
    <circle cx="260" cy="228" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="276" cy="228" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="292" cy="228" r="5" fill="#D63939" />
    <rect x="310" y="224" width="26" height="8" rx="4" fill="#454C5E" />

    <rect x="242" y="258" width="106" height="36" rx="6" fill="#1A2030" />
    <circle cx="260" cy="276" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="276" cy="276" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <rect x="292" y="272" width="44" height="8" rx="4" fill="#454C5E" />

    <rect x="242" y="306" width="106" height="36" rx="6" fill="#1A2030" />
    <circle cx="260" cy="324" r="5" fill="#D63939" />
    <rect x="276" y="320" width="60" height="8" rx="4" fill="#454C5E" />

    <rect x="242" y="354" width="106" height="116" rx="6" fill="#1A2030" />
    <path d="M260 430L295 370L330 430Z" fill="#F59F00" opacity="0.2" />
    <path d="M295 382L320 425H270L295 382Z" fill="none" stroke="#F59F00" stroke-width="4" stroke-linejoin="round" />
    <text x="295" y="418" text-anchor="middle" fill="#F59F00" font-family="sans-serif" font-weight="bold" font-size="20">!</text>

    <!-- Right Server Tower -->
    <rect x="440" y="190" width="130" height="300" rx="12" fill="#232B41" class="tblr-illustrations-500-card" />
    <rect x="452" y="210" width="106" height="36" rx="6" fill="#1A2030" />
    <circle cx="470" cy="228" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="486" cy="228" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />
    <circle cx="502" cy="228" r="5" fill="#206BC4" style="fill: var(--tblr-primary, #206bc4)" />

    <rect x="452" y="258" width="106" height="36" rx="6" fill="#1A2030" />
    <circle cx="470" cy="276" r="5" fill="#F59F00" />
    <circle cx="486" cy="276" r="5" fill="#454C5E" />
    <rect x="502" y="272" width="34" height="8" rx="4" fill="#454C5E" />

    <rect x="452" y="306" width="106" height="164" rx="6" fill="#1A2030" />
    <!-- Ventilation Slots -->
    <line x1="466" y1="330" x2="544" y2="330" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />
    <line x1="466" y1="346" x2="544" y2="346" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />
    <line x1="466" y1="362" x2="544" y2="362" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />
    <line x1="466" y1="378" x2="544" y2="378" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />
    <line x1="466" y1="394" x2="544" y2="394" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />
    <line x1="466" y1="410" x2="544" y2="410" stroke="#454C5E" stroke-width="4" stroke-linecap="round" />

    <!-- Center Connection Cables & Disconnect Spark -->
    <path d="M348 276 C370 276 375 330 388 330" fill="none" stroke="#206BC4" stroke-width="5" stroke-linecap="round" style="stroke: var(--tblr-primary, #206bc4)" />
    <path d="M452 276 C430 276 425 330 412 330" fill="none" stroke="#206BC4" stroke-width="5" stroke-linecap="round" style="stroke: var(--tblr-primary, #206bc4)" />
    
    <!-- Cable Plugs -->
    <rect x="384" y="322" width="12" height="16" rx="3" fill="#A6A9B3" />
    <rect x="404" y="322" width="12" height="16" rx="3" fill="#A6A9B3" />
    
    <!-- Spark / Warning Rays -->
    <path d="M400 310 L400 300 M390 314 L380 306 M410 314 L420 306" stroke="#D63939" stroke-width="4" stroke-linecap="round" />

    <!-- Big Central Gear -->
    <g transform="translate(400, 160)">
        <path d="M0 -35 L7 -35 L10 -25 L20 -20 L28 -25 L33 -20 L28 -10 L32 0 L42 3 L42 10 L32 15 L28 25 L33 30 L28 35 L18 30 L10 35 L7 45 L0 45 L-7 45 L-10 35 L-20 30 L-28 35 L-33 30 L-28 20 L-32 10 L-42 7 L-42 0 L-32 -7 L-28 -17 L-33 -22 L-28 -27 L-18 -22 L-10 -27 L-7 -35 Z" fill="#0455A4" style="fill: var(--tblr-illustrations-primary, var(--tblr-primary, #0455a4))" />
        <circle cx="0" cy="4" r="14" fill="#F7F8FC" class="tblr-illustrations-500-bubble" />
        <text x="0" y="10" text-anchor="middle" fill="#D63939" font-family="sans-serif" font-weight="bold" font-size="18">!</text>
    </g>
</svg>
